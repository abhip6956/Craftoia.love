{% extends "base.html" %}
{% block content %}
<section class="form-card wide"><p class="eyebrow">STORE INVENTORY</p><h1>{{ 'Edit product' if product else 'Add a product' }}</h1>
<form method="post" class="form">
<label>Product name<input name="name" value="{{ product.name if product else '' }}" required></label>
<label>Description<textarea name="description" rows="3">{{ product.description if product else '' }}</textarea></label>
<label>Price (₹)<input type="number" name="price" min="1" step="0.01" value="{{ product.price if product else '' }}" required></label>
<label>Stock quantity<input type="number" name="stock" min="0" value="{{ product.stock if product else '0' }}" required></label>
<label>Product image URL (optional)<input type="url" name="image_url" value="{{ product.image_url if product else '' }}" placeholder="https://..."></label>
<button class="button full" type="submit">{{ 'Save changes' if product else 'Add product' }}</button>
</form></section>{% endblock %}
