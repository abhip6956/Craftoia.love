{% extends "base.html" %}
{% block content %}
<section class="detail-card">
  {% if product.image_url %}<img class="detail-image" src="{{ product.image_url }}" alt="{{ product.name }}">{% else %}<div class="detail-placeholder">♡</div>{% endif %}
  <div><p class="eyebrow">CRAFTORIA COLLECTION</p><h1>{{ product.name }}</h1><p class="lead">{{ product.description }}</p><h2>₹{{ "%.2f"|format(product.price) }}</h2><p class="muted">{{ product.stock }} available</p>
  <form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><button class="button" type="submit" {% if product.stock < 1 %}disabled{% endif %}>Add to cart</button></form></div>
</section>
{% endblock %}
